(()=>{
const SAY=["You are made of trillions of cells.", "Almost every one of them is reading from an instruction manual.", "Look inside one cell. The nucleus is its control centre.", "Out of the nucleus comes the instruction manual: your DNA. Long, but surprisingly short to create you.", "You began as one cell, carrying the whole book.", "They can make every kind of cell in the body, and each new cell gets the whole book.", "A stem cell has not chosen its courses yet. Then cells specialise, just as you take different courses at school or university, some in art, some in science. Skin, muscle, nerve, bone. Same book, different parts.", "If this manual were in English, it might say: how to build a nerve cell.", "One paragraph is one instruction. In your body, that paragraph is called a gene.", "So how would you read it? The real writing is far too small to see. Imagine you cannot see this page at all.", "We cannot see the writing, so let us start with a puzzle. Nothing to do with DNA yet, just a plain sentence. The machine uses the same trick.", "Sequencing means finding the order. Here is a sentence, hidden in boxes. We cannot see it. But someone can repeat it to us.", "Here are the rules. Someone repeats the sentence from the start. At a random moment, a stop is called. We get only the last word they reached, and its number. Then they start again from the beginning.", "It is repeated from the start, and stopped at random. Stop! We hear only the last word, and how many words they got to: CAT, word 2.", "Repeat it again, stopped somewhere else: ON, word 4. And again. Every repeat gives us one more word and its number.", "What do we need besides the word? Its number, which is how far that repeat got. Sort them, short to long.", "Read down the last words: the cat sat on the mat. You just sequenced a sentence.", "But it is not in English. The whole thing is written with four letters: A, T, G and C. Computers manage with two digits, 0 and 1.", "The same letters in a different order make a different instruction.", "In these letters, one paragraph is still a gene.", "Now the real thing. Take one line of the book and shrink it to what is really there: a chain, one bead for each letter. Like the boxes, we cannot see it. The beads cannot shout their names.", "To read it we use a sequencer, a closed box. You cannot see what happens in there, so let us open it.", "Same trick as the sentence. Here this figure stands for the copying, repeating the chain. The guard stands for chance: nobody decides where the stop falls.", "It walks from the start, repeating the chain one letter at a time. When DNA is repeated, we call it copying. These letters have no dye, so we cannot see which they are.", "The guard stops it, completely at random.", "The letter added at the stop carries a fluorescent dye, so it glows. It is the only one we can see, just like hearing only the last word.", "Every copy starts in the same place. Only the stop is different. Again and again, until there is a copy stopping at every letter.", "Now we have copies of every length, all mixed up.", "We repeat it millions of times. One glowing bead is too faint to see; millions together are bright enough. Put them in order of length and they make a staircase.", "This is how we do it. They go into a thin tube filled with gel, and electricity pulls them through. The gel is a tangled mesh. Small is fast, big is slow. So the gel puts them in order: first out is letter 1, next is letter 2. At the end, a light makes each colour glow.", "Colour by colour, the order we could not see appears.", "Here is what the light saw: shortest to longest, a staircase, just like your sentence. Read the glowing letters in order and you have the whole chain.", "Put what we read next to the book. Every letter matches. We have read it.", "Now a researcher comes to us with stem cells. They want to know what one paragraph does.", "To find out what a gene does, researchers remove it from the cells. That is called a knockout.", "So they take it out. Scissors cut the paragraph out of the book.", "They bring the cells back, and we read it again, the same way.", "This time it does not line up. The start matches, the end matches, and the paragraph between them is gone.", "Here is what we read, as the machine shows it. On the real instrument, it looks like this.", "Back to the manual. What if a paragraph goes missing? Think of a detective story.", "Sometimes nothing happens. That paragraph only described the house. Nice to know, but the story still works.", "Sometimes the story falls apart. That paragraph held the clues to how the killer was caught, or who the killer is, and now you never find out.", "Scientists do this for real, one gene at a time, to find out which ones matter when people get ill.", "Every cell carries the same book.", "Sequencing reads the order of the letters.", "A knockout removes a gene, to learn what it does.", "Reading it again shows it has gone, so now we can watch what changes."];

/* helpers */
function A(a,fn){ctx.save();ctx.globalAlpha*=a;fn();ctx.restore();}

/* a label with a pointer to the thing it names */

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){t+=dt;clock+=dt;}
